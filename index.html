
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Arena — Chess</title>
<style>

.clock-settings {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 15px 0;
  color: #dfbd69;
}

.clock-settings select {
  background: #171717;
  color: #dfbd69;
  border: 1px solid #b89435;
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 15px;
}

.clocks {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 12px 0;
}

.clock {
  flex: 1;
  text-align: center;
  padding: 12px;
  border: 1px solid #555;
  border-radius: 8px;
  background: #171717;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.clock.active {
  border: 2px solid #dfbd69;
  color: #dfbd69;
  background: #292315;
  box-shadow: 0 0 14px rgba(223, 189, 105, 0.35);
  transform: scale(1.03);
}

.black-piece {
  color: #171717 !important;
  text-shadow: 0 1px 1px #000;
}

.white-piece {
  color: #fffdf5 !important;
  text-shadow: 0 1px 2px #8a7650;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 14px;
  min-height: 100vh;
  background: #101010;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
}

.app { width: min(100%, 620px); }

h1 {
  text-align: center;
  color: #dfbd69;
  letter-spacing: 4px;
  margin-bottom: 6px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 24px;
}

.themes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 18px;
}

button {
  cursor: pointer;
  padding: 10px 13px;
  border: 1px solid #555;
  border-radius: 8px;
  background: #222;
  color: white;
}

button.active {
  border-color: #dfbd69;
  color: #dfbd69;
}

.board {
  display: grid;
  position: relative;
  grid-template-columns: repeat(8, 1fr);
  width: 100%;
  aspect-ratio: 1;
  border: 3px solid #555;
  border-radius: 4px;
  overflow: hidden;
}
.coordinates {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  width: 100%;
  color: #dfbd69;
  font-size: 12px;
  text-align: center;
  padding: 5px 0;
  user-select: none;
}

.coordinates span {
  display: block;
}


.board-wrap {
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
}

.board-row {
  display: flex;
  align-items: stretch;
}

.rank-coordinates {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  width: 24px;
  flex-shrink: 0;
  color: #dfbd69;
  font-size: 12px;
  text-align: center;
}

.square {
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  aspect-ratio: 1;
  padding: 0;
  border: 0;
  border-radius: 0;
  font-size: clamp(23px, 7vw, 44px);
  line-height: 1;
  user-select: none;
}

.light { background: var(--light); }
.dark { background: var(--dark); }

.square.selected {
  box-shadow: inset 0 0 0 4px #40c878;
}


.square.last-move {
  background: rgba(212, 175, 55, 0.48) !important;
  box-shadow: inset 0 0 0 3px rgba(212, 175, 55, 0.75);
}

.square.in-check {
  background: rgba(255, 45, 45, 0.65) !important;
  box-shadow: inset 0 0 0 3px rgba(255, 45, 45, 0.95);
}


.square.possible-move::after {
  content: "";
  position: absolute;
  width: 24%;
  height: 24%;
  border-radius: 50%;
  background: #40c878;
  opacity: 0.75;
  pointer-events: none;
}

.square.possible-capture {
  box-shadow: inset 0 0 0 4px #e05252;
}


.piece {
  position: relative;
  z-index: 1;
  display: inline-block;
  font-family: "DejaVu Sans", "Segoe UI Symbol", "Arial Unicode MS", sans-serif;
  filter: none;
  -webkit-text-stroke: 0.5px currentColor;
  will-change: transform;
}

.black-piece {
  color: #171717 !important;
  text-shadow: none;
}

.white-piece {
  color: #fffdf5 !important;
  text-shadow: 0 1px 2px #8a7650;
}

.status {
  margin-top: 16px;
  text-align: center;
  color: #ddd;
  min-height: 24px;
}

.actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 14px;
}

body.gold {
  --light: #e8d7a5;
  --dark: #76572c;
}

body.wood {
  --light: #efd9b5;
  --dark: #99613e;
}

body.darkmode {
  --light: #b9bec7;
  --dark: #454b57;
}

body.emerald {
  --light: #e7e5d6;
  --dark: #26765c;
}

.clock-player {
  display: block;
  font-size: 12px !important;
  font-weight: normal;
  line-height: 1.3;
}

.clock-time {
  display: block;
  font-size: 21px !important;
  font-weight: bold;
  line-height: 1.3;
}

.clock.low-time {
  color: #ff4d4d;
  border-color: #ff4d4d;
  background: #351515;
  box-shadow: 0 0 14px rgba(255, 77, 77, 0.45);
  animation: clock-warning 0.8s infinite alternate;
}

@keyframes clock-warning {
  from {
    box-shadow: 0 0 5px rgba(255, 77, 77, 0.2);
  }
  to {
    box-shadow: 0 0 16px rgba(255, 77, 77, 0.7);
  }
}


/* Сообщение о завершении партии */
.game-result {
  position: relative;
  inset: auto;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 12px 0 0;
  background: transparent;
  pointer-events: auto;
}
.game-result-card {
  width: min(100%, 360px);
  padding: 18px 16px;
  pointer-events: auto;
  text-align: center;
  color: #fff8e5;
  background: linear-gradient(145deg, #292315, #111);
  border: 1px solid #dfbd69;
  border-radius: 18px;
  box-shadow: 0 16px 55px rgba(0,0,0,.55), 0 0 24px rgba(223,189,105,.18);
  animation: result-pop .25s ease-out;
}
.game-result-icon { font-size: 34px; margin-bottom: 6px; }
.game-result-title { color: #dfbd69; font-size: 22px; font-weight: 800; margin-bottom: 6px; }
.game-result-text { color: #e5e0d3; margin-bottom: 12px; line-height: 1.4; }
.game-result-card button { border-color: #dfbd69; color: #dfbd69; }
@keyframes result-pop {
  from { opacity: 0; transform: translateY(8px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

</style>
</head>
<body class="gold">
<main class="app">
  <h1>GAME ARENA</h1>
  <div class="subtitle">CHESS · YOUR ARENA</div>

  <div class="themes">
    <button class="active" data-theme="gold">👑 Gold</button>
    <button data-theme="wood">🪵 Wood</button>
    <button data-theme="darkmode">🌑 Dark</button>
    <button data-theme="emerald">💚 Emerald</button>
  </div>


<div class="board-wrap">
  <div class="coordinates">
    <span>A</span><span>B</span><span>C</span><span>D</span>
    <span>E</span><span>F</span><span>G</span><span>H</span>
  </div>
  <div class="board-row">
    <div class="rank-coordinates">
      <span>8</span><span>7</span><span>6</span><span>5</span>
      <span>4</span><span>3</span><span>2</span><span>1</span>
    </div>
    <div id="board" class="board"></div>
  </div>
</div>

<div id="status" class="status">
  ♙ Ход белых
</div>

<div class="online-panel" style="margin:14px 0;padding:12px;border:1px solid #b89435;border-radius:10px;background:#171717;text-align:center;">
  <div style="color:#dfbd69;font-weight:bold;margin-bottom:8px;">♟ Игра с другом онлайн</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
    <button id="create-room">Создать комнату</button>
    <input id="room-code" placeholder="Код комнаты" maxlength="8" style="width:125px;background:#222;color:#fff;border:1px solid #555;border-radius:8px;padding:9px;">
    <button id="join-room">Войти</button>
    <button id="copy-room" style="display:none;">Копировать ссылку</button>
  </div>
  <div id="online-status" style="margin-top:8px;color:#aaa;font-size:13px;">Создай комнату и отправь другу код.</div>
</div>

<div class="game-mode">
  <label for="game-mode">Режим игры:</label>
  <select id="game-mode">
    <option value="computer">🤖 Против компьютера</option>
    <option value="two-players">♟ На двоих</option>
  </select>
</div>

<div class="clock-settings">
  <label for="time-control">Время на партию:</label>
  <select id="time-control">
    <option value="60">1+0 — Пуля</option>
    <option value="180">3+0 — Блиц</option>
    <option value="300" selected>5+0 — Блиц</option>
  </select>
</div>

<div class="clocks">
  <div class="clock" id="black-clock">
    <span class="clock-player">♟ ЧЁРНЫЕ</span>
    <span class="clock-time">5:00</span>
  </div>

  <div class="clock active" id="white-clock">
    <span class="clock-player">♙ БЕЛЫЕ</span>
    <span class="clock-time">5:00</span>
  </div>
</div>

  <div class="actions">
    <button id="reset">↻ Новая расстановка</button>


  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const boardElement = document.getElementById("board");
const gameMode = document.getElementById("game-mode");
const audioContext = new (
  window.AudioContext || window.webkitAudioContext
)();


const moveSound = new Audio("./sounds/Wood%20click.mp3");
const captureSound = new Audio("./sounds/capture.mp3");

moveSound.preload = "auto";
captureSound.preload = "auto";

moveSound.volume = 0.7;
captureSound.volume = 0.8;

function playSound(type = "move") {
  const sound = type === "capture" ? captureSound : moveSound;

  sound.currentTime = 0;

  sound.play().catch(error => {
    console.log("Не удалось воспроизвести звук:", error);
  });
}

const statusElement = document.getElementById("status");

const whiteClock = document.getElementById("white-clock");
const blackClock = document.getElementById("black-clock");
const timeControl = document.getElementById("time-control");

let whiteTime = Number(timeControl.value);
let blackTime = Number(timeControl.value);
let clockInterval = null;
let clockStarted = false;
let clockGameOver = false;

function formatTime(seconds) {
  const minutes = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return `${minutes}:${String(secs).padStart(2, "0")}`;
}

function updateClocks() {
  whiteClock.querySelector(".clock-time").textContent =
    formatTime(whiteTime);

  blackClock.querySelector(".clock-time").textContent =
    formatTime(blackTime);

  whiteClock.classList.toggle(
    "low-time",
    whiteTime <= 10 && whiteTime > 0
  );

  blackClock.classList.toggle(
    "low-time",
    blackTime <= 10 && blackTime > 0
  );

  whiteClock.classList.toggle(
    "active",
    clockStarted && game.turn() === "w" && !clockGameOver
  );

  blackClock.classList.toggle(
    "active",
    clockStarted && game.turn() === "b" && !clockGameOver
  );
}

function stopClocks() {
  clearInterval(clockInterval);
  clockInterval = null;
  clockGameOver = true;
  updateClocks();
}

timeControl.addEventListener("change", () => {
  clearInterval(clockInterval);
  clockInterval = null;

  whiteTime = Number(timeControl.value);
  blackTime = Number(timeControl.value);

  clockStarted = false;
  clockGameOver = false;

  updateClocks();
  statusElement.textContent = "♙ Ход белых.";
});

function startClocks() {
  if (clockStarted || clockGameOver) return;

  clockStarted = true;

  clockInterval = setInterval(() => {
    if (game.turn() === "w") {
      whiteTime--;
    } else {
      blackTime--;
    }

    updateClocks();

    if (whiteTime <= 0 || blackTime <= 0) {
      stopClocks();

      const loser = whiteTime <= 0 ? "белые" : "чёрные";
      statusElement.textContent =
        "⏱️ Время вышло! Проиграли " + loser + ".";

      return;
    }
  }, 1000);

  updateClocks();
}

const initialPosition = [
  "♜","♞","♝","♛","♚","♝","♞","♜",
  "♟","♟","♟","♟","♟","♟","♟","♟",
  "","","","","","","","",
  "","","","","","","","",
  "","","","","","","","",
  "","","","","","","","",
  "♙","♙","♙","♙","♙","♙","♙","♙",
  "♖","♘","♗","♕","♔","♗","♘","♖"
];

let position = [...initialPosition];
const game = new Chess();

// Firebase online rooms (anonymous sign-in is required in Firebase Authentication).
const firebaseConfig = {
  apiKey: "AIzaSyBohNV7J1DTAzkwvL3wf5tAmoIK-K_CcW8",
  authDomain: "game-arena-chess.firebaseapp.com",
  databaseURL: "https://game-arena-chess-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "game-arena-chess",
  storageBucket: "game-arena-chess.firebasestorage.app",
  messagingSenderId: "167311039922",
  appId: "1:167311039922:web:939a3eac32d56272a2d8ab"
};
let onlineEnabled = false;
let onlineRoomId = null;
let onlineColor = null;
let onlineRoomRef = null;
let onlineUid = null;
let applyingRemoteState = false;
const onlineStatus = document.getElementById("online-status");
const roomCodeInput = document.getElementById("room-code");
const createRoomButton = document.getElementById("create-room");
const joinRoomButton = document.getElementById("join-room");
const copyRoomButton = document.getElementById("copy-room");

try {
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  firebase.auth().signInAnonymously().then(userCredential => {
    onlineUid = userCredential.user.uid;
    onlineStatus.textContent = "Готово к онлайн-игре. Создай комнату или введи код друга.";
  }).catch(error => {
    console.error("Firebase sign-in:", error);
    onlineStatus.textContent = "Нужно включить Anonymous sign-in в Firebase Authentication.";
  });
} catch (error) {
  console.error("Firebase init:", error);
  onlineStatus.textContent = "Не удалось подключиться к Firebase. Проверь настройки приложения.";
}

function makeRoomCode() {
  return Math.random().toString(36).slice(2, 8).toUpperCase();
}
function roomInviteUrl(code) {
  const url = new URL(window.location.href);
  url.searchParams.set("room", code);
  return url.toString();
}
function setOnlineMode(code, color, ref) {
  onlineEnabled = true;
  onlineRoomId = code;
  onlineColor = color;
  onlineRoomRef = ref;
  gameMode.value = "two-players";
  roomCodeInput.value = code;
  copyRoomButton.style.display = "inline-block";
  onlineStatus.textContent = "Комната " + code + " · ты играешь " + (color === "w" ? "белыми" : "чёрными") + ".";
  ref.on("value", snapshot => {
    const room = snapshot.val();
    if (!room || !room.fen || applyingRemoteState) return;
    if (room.players && room.players[onlineColor] !== onlineUid) {
      onlineStatus.textContent = "Комната недоступна или игрок уже подключён.";
      return;
    }
    if (game.fen() !== room.fen) {
      applyingRemoteState = true;
      game.load(room.fen);
      position = game.board().flat().map(piece => {
        if (!piece) return "";
        const symbols = {wp:"♙",wn:"♘",wb:"♗",wr:"♖",wq:"♕",wk:"♔",bp:"♟",bn:"♞",bb:"♝",br:"♜",bq:"♛",bk:"♚"};
        return symbols[piece.color + piece.type];
      });
      selected = null;
      lastMove = null;
      drawBoard();
      statusElement.textContent = game.in_checkmate() ? "🏆 Шах и мат!" : (game.in_check() ? "♟️ Шах!" : (game.turn() === "w" ? "♙ Ход белых." : "♟ Ход чёрных."));
      applyingRemoteState = false;
    }
    const opponent = onlineColor === "w" ? "b" : "w";
    onlineStatus.textContent = room.players && room.players[opponent]
      ? "Комната " + code + " · соперник подключён."
      : "Комната " + code + " · ждём друга. Отправь ему код или ссылку.";
  });
}
createRoomButton.addEventListener("click", async () => {
  if (!onlineUid) { onlineStatus.textContent = "Подключение к Firebase ещё не готово. Подожди секунду и попробуй снова."; return; }
  try {
    const code = makeRoomCode();
    const ref = firebase.database().ref("rooms/" + code);
    const initialGame = new Chess();
    await ref.set({ fen: initialGame.fen(), players: { w: onlineUid, b: null }, createdAt: firebase.database.ServerValue.TIMESTAMP });
    setOnlineMode(code, "w", ref);
  } catch (error) {
    console.error(error);
    onlineStatus.textContent = "Не удалось создать комнату. Проверь правила Realtime Database.";
  }
});
joinRoomButton.addEventListener("click", async () => {
  if (!onlineUid) { onlineStatus.textContent = "Подключение к Firebase ещё не готово. Подожди секунду и попробуй снова."; return; }
  const code = roomCodeInput.value.trim().toUpperCase();
  if (!code) { onlineStatus.textContent = "Введи код комнаты."; return; }
  try {
    const ref = firebase.database().ref("rooms/" + code);
    const snap = await ref.once("value");
    const room = snap.val();
    if (!room) { onlineStatus.textContent = "Комната не найдена. Проверь код."; return; }
    let color;
    if (room.players && room.players.w === onlineUid) color = "w";
    else if (room.players && room.players.b === onlineUid) color = "b";
    else if (!room.players || !room.players.b) {
      color = "b";
      await ref.child("players/b").set(onlineUid);
    } else { onlineStatus.textContent = "В комнате уже два игрока."; return; }
    setOnlineMode(code, color, ref);
  } catch (error) {
    console.error(error);
    onlineStatus.textContent = "Не удалось войти. Проверь правила Realtime Database.";
  }
});
copyRoomButton.addEventListener("click", async () => {
  if (!onlineRoomId) return;
  try {
    await navigator.clipboard.writeText(roomInviteUrl(onlineRoomId));
    onlineStatus.textContent = "Ссылка на комнату скопирована. Отправь её другу.";
  } catch (_) {
    onlineStatus.textContent = "Код комнаты: " + onlineRoomId + ". Отправь его другу.";
  }
});
const requestedRoom = new URLSearchParams(window.location.search).get("room");
if (requestedRoom) roomCodeInput.value = requestedRoom.toUpperCase();

let selected = null;
let lastMove = null;


function showGameResult(title, message, icon = "🏆") {
  if (document.querySelector(".game-result")) return;
  const overlay = document.createElement("div");
  overlay.className = "game-result";
  overlay.innerHTML = `
    <div class="game-result-card" role="dialog" aria-modal="true">
      <div class="game-result-icon">${icon}</div>
      <div class="game-result-title">${title}</div>
      <div class="game-result-text">${message}</div>
      <button type="button" id="result-new-game">↻ Новая партия</button>
    </div>`;
  const boardWrap = document.querySelector(".board-wrap");
  if (boardWrap) {
    if (getComputedStyle(boardWrap).position === "static") {
      boardWrap.style.position = "relative";
    }
    boardWrap.appendChild(overlay);
  } else {
    document.body.appendChild(overlay);
  }
  document.getElementById("result-new-game").addEventListener("click", () => {
    overlay.remove();
    document.getElementById("reset").click();
  });
}

function computerMove() {
  if (game.game_over()) return;

  const moves = game.moves();

  if (moves.length === 0) return;

  // Выбираем лучший из легальных ходов: мат, взятие фигуры,
  // шах и развитие фигур получают приоритет.
  const verboseMoves = game.moves({ verbose: true });
  const pieceValues = { p: 10, n: 30, b: 32, r: 50, q: 90, k: 900 };

  function scoreMove(move) {
    let score = 0;

    // Если ход ставит мат — это лучший ход.
    const result = game.move({
      from: move.from,
      to: move.to,
      promotion: move.promotion || "q"
    });

    if (!result) return -Infinity;

    if (game.in_checkmate()) score += 100000;
    else if (game.in_check()) score += 50;

    if (move.captured) {
      score += (pieceValues[move.captured] || 0) * 10;
      score -= (pieceValues[move.piece] || 0);
    }

    // Небольшой бонус за продвижение пешки.
    if (move.piece === "p" && move.to[1] === "1") score += 8;

    game.undo();
    return score;
  }

  let bestScore = -Infinity;
  let bestMoves = [];

  for (const move of verboseMoves) {
    const score = scoreMove(move);
    if (score > bestScore) {
      bestScore = score;
      bestMoves = [move];
    } else if (score === bestScore) {
      bestMoves.push(move);
    }
  }

  const chosenMove = bestMoves[
    Math.floor(Math.random() * bestMoves.length)
  ];

  game.move({
    from: chosenMove.from,
    to: chosenMove.to,
    promotion: chosenMove.promotion || "q"
  });

  lastMove = null;
  selected = null;

  position = game.board().flat().map(piece => {
    if (!piece) return "";

    const symbols = {
      wp: "♙", wn: "♘", wb: "♗", wr: "♖", wq: "♕", wk: "♔",
      bp: "♟", bn: "♞", bb: "♝", br: "♜", bq: "♛", bk: "♚"
    };

    return symbols[piece.color + piece.type];
  });

  drawBoard();

  if (game.in_checkmate()) {
    stopClocks();
    const winner = game.turn() === "w" ? "чёрные" : "белые";
    statusElement.textContent = "🏆 Мат! Победили " + winner + "!";
    showGameResult("Шах и мат!", "Победили " + winner + "!", "🏆");
  } else if (game.in_draw()) {
    stopClocks();
    statusElement.textContent = "🤝 Ничья! Партия окончена.";
    showGameResult("Ничья!", "Партия завершилась вничью.", "🤝");
  } else if (game.in_check()) {
    statusElement.textContent = "♟️ Шах!";
  } else {
    statusElement.textContent = "♙ Твой ход.";
  }
}

function drawBoard()  {
  boardElement.innerHTML = "";

  position.forEach((piece, index) => {
    const row = Math.floor(index / 8);
    const col = index % 8;

    const square = document.createElement("button");
    square.className = "square " +
      ((row + col) % 2 === 0 ? "light" : "dark");

    if (selected === index) square.classList.add("selected");

    const boardRow = game.board()[row];
const chessPiece = boardRow[col];

if (
  chessPiece &&
  chessPiece.type === "k" &&
  chessPiece.color === game.turn() &&
  game.in_check()
) {
  square.classList.add("in-check");
}
if (lastMove && (index === lastMove.from || index === lastMove.to)) {
  square.classList.add("last-move");
}


if (selected !== null) {
  const files = "abcdefgh";
  const from = files[selected % 8] + (8 - Math.floor(selected / 8));
  const toSquare = files[index % 8] + (8 - row);

  const moves = game.moves({ square: from, verbose: true });
  const possibleMove = moves.find(move => move.to === toSquare);

  if (possibleMove) {
    if (possibleMove.captured) {
      square.classList.add("possible-capture");
    } else {
      square.classList.add("possible-move");
    }
  }
}


if (piece) {
  const span = document.createElement("span");
  span.className = "piece";

  if ("♜♞♝♛♚♟".includes(piece)) {
    span.classList.add("black-piece");
  } else {
    span.classList.add("white-piece");
  }

  span.textContent = piece;
  square.appendChild(span);
}

    square.setAttribute(
      "aria-label",
      `Клетка ${String.fromCharCode(97 + col)}${8 - row}`
    );

    square.addEventListener("click", () => handleSquare(index));
    boardElement.appendChild(square);
  });
}



async function handleSquare(index) {
  if (onlineEnabled && onlineColor !== game.turn()) {
    statusElement.textContent = "Сейчас ход соперника.";
    return;
  }
  if (clockGameOver) {
    return;
  }

  if (game.in_checkmate()) {
    statusElement.textContent =
      "Шах и мат! Победили " +
      (game.turn() === "w" ? "чёрные!" : "белые!");
    return;
  }

  if (game.in_draw()) {
    statusElement.textContent = "Ничья! Партия окончена.";
    return;
  }



  const files = "abcdefgh";

  if (selected === null) {
    const piece = game.board()[Math.floor(index / 8)][index % 8];

    if (!piece) {
      statusElement.textContent = "Сначала выбери клетку с фигурой.";
      return;
    }

    if (
      (game.turn() === "w" && piece.color !== "w") ||
      (game.turn() === "b" && piece.color !== "b")
    ) {
      statusElement.textContent = "Сейчас ходит другая сторона.";
      return;
    }

    selected = index;
    statusElement.textContent = "Теперь выбери клетку назначения.";
    drawBoard();
    return;
  }

  const fromIndex = selected;
  const toIndex = index;

  const fromSquare =
    files[fromIndex % 8] + (8 - Math.floor(fromIndex / 8));
  const toSquare =
    files[toIndex % 8] + (8 - Math.floor(toIndex / 8));

  const originalPiece =
    boardElement.children[fromIndex]?.querySelector(".piece");

  const startRect = originalPiece?.getBoundingClientRect();
  const movingSymbol = originalPiece?.textContent;
  const movingClass = originalPiece?.className;

  const move = game.move({
    from: fromSquare,
    to: toSquare,
    promotion: "q"
  });

if (move) {
  lastMove = {
    from: fromIndex,
    to: toIndex
  };
  if (onlineEnabled && onlineRoomRef && !applyingRemoteState) {
    onlineRoomRef.update({ fen: game.fen(), lastMove: { from: fromSquare, to: toSquare }, updatedAt: firebase.database.ServerValue.TIMESTAMP })
      .catch(error => {
        console.error("Не удалось сохранить ход:", error);
        onlineStatus.textContent = "Ход не синхронизирован. Проверь правила базы.";
      });
  }

  startClocks();
  updateClocks();
playSound(move.captured ? "capture" : "move");
}

  selected = null;

if (!move) {
  statusElement.textContent = "Так ходить нельзя. Попробуй другой ход.";
} else if (game.in_checkmate()) {
  stopClocks();
  const winner = game.turn() === "w" ? "чёрные" : "белые";
  statusElement.textContent = "🏆 Мат! Победили " + winner + "!";
  showGameResult("Шах и мат!", "Победили " + winner + "!", "🏆");
} else if (game.in_draw()) {
  stopClocks();
  statusElement.textContent = "🤝 Ничья! Партия окончена.";
  showGameResult("Ничья!", "Партия завершилась вничью.", "🤝");
} else if (game.in_check()) {
  statusElement.textContent =
    "♟️ Шах! Ход " +
    (game.turn() === "w" ? "белых." : "чёрных.");
} else {
  statusElement.textContent =
    (game.turn() === "w" ? "♙ Ход белых." : "♟ Ход чёрных.");
}

  position = game.board().flat().map(piece => {
    if (!piece) return "";

    const symbols = {
      wp: "♙", wn: "♘", wb: "♗", wr: "♖", wq: "♕", wk: "♔",
      bp: "♟", bn: "♞", bb: "♝", br: "♜", bq: "♛", bk: "♚"
    };

    return symbols[piece.color + piece.type];
  });

  drawBoard();

  if (!move || !startRect || !movingSymbol) return;

  const destinationSquare = boardElement.children[toIndex];
  const destinationPiece = destinationSquare?.querySelector(".piece");
  const endRect = destinationSquare?.getBoundingClientRect();

  if (!destinationSquare || !endRect) return;

  const ghost = document.createElement("span");
  ghost.className = movingClass || "piece";
  ghost.textContent = movingSymbol;

  Object.assign(ghost.style, {
    position: "fixed",
    left: startRect.left + "px",
    top: startRect.top + "px",
    width: startRect.width + "px",
    height: startRect.height + "px",
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
    margin: "0",
    zIndex: "9999",
    pointerEvents: "none"
  });

  document.body.appendChild(ghost);

  if (destinationPiece) {
    destinationPiece.style.visibility = "hidden";
  }

  const dx =
    endRect.left + (endRect.width - startRect.width) / 2 - startRect.left;
  const dy =
    endRect.top + (endRect.height - startRect.height) / 2 - startRect.top;

  const animation = ghost.animate(
    [
      { transform: "translate(0, 0)" },
      { transform: `translate(${dx}px, ${dy}px)` }
    ],
    {
      duration: 180,
      easing: "ease-in-out",
      fill: "forwards"
    }
  );

animation.onfinish = () => {
  ghost.remove();

  if (destinationPiece) {
    destinationPiece.style.visibility = "";
  }

  if (
    !onlineEnabled &&
    gameMode.value === "computer" &&
    game.turn() === "b" &&
    !game.game_over() &&
    !clockGameOver
  ) {
    setTimeout(() => {
      computerMove();

      startClocks();
      updateClocks();
      playSound("move");
    }, 500);
  }
};
}


document.querySelectorAll("[data-theme]").forEach(button => {
  button.addEventListener("click", () => {
    document.body.className = button.dataset.theme;

    document.querySelectorAll("[data-theme]").forEach(item => {
      item.classList.toggle("active", item === button);
    });
  });
});

document.getElementById("reset").addEventListener("click", () => {
  document.querySelector(".game-result")?.remove();
  game.reset();
  position = [...initialPosition];
  selected = null;
  lastMove = null;

  clearInterval(clockInterval);
  clockInterval = null;

  whiteTime = Number(timeControl.value);
  blackTime = Number(timeControl.value);
  clockStarted = false;
  clockGameOver = false;

  updateClocks();

  statusElement.textContent = "♙ Ход белых.";
  drawBoard();
});



drawBoard();
</script>
</body>
</html>
